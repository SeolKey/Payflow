<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제하기 - PayFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- PortOne Checkout V2 SDK -->
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-wallet2 me-2"></i>PayFlow
        </a>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">
                        <i class="bi bi-credit-card me-2"></i>결제하기
                    </h3>
                </div>

                <div class="card-body p-4">
                    <div id="payment-info" class="mb-4">
                        <div class="mb-3">
                            <strong>주문번호:</strong> <span th:text="${pgParams.orderId}"></span>
                        </div>
                        <div class="mb-3">
                            <strong>결제금액:</strong> <span th:text="${pgParams.amount}"></span>원
                        </div>
                        <div class="mb-3">
                            <strong>상품명:</strong> <span th:text="${pgParams.orderName}"></span>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button id="payment-request-button" class="btn btn-primary btn-lg">
                            <i class="bi bi-check-circle me-2"></i>결제하기
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => {

        const pgParams = /*[[${pgParams}]]*/ {};

        const storeId = pgParams.storeId;
        const orderId = pgParams.orderId;
        const amount = Number(pgParams.amount);
        const orderName = pgParams.orderName || "PayFlow 결제";

        // Checkout V2 리다이렉트 URL
        const successUrl = `/api/pay/success?orderId=${orderId}`;
        const failUrl = `/api/pay/fail?orderId=${orderId}`;

        const payButton = document.getElementById("payment-request-button");

        if (!payButton) {
            alert("결제 버튼을 찾을 수 없습니다.");
            return;
        }

        // SDK 로드 대기
        function waitForSDK(callback, maxAttempts = 40) {
            let attempts = 0;
            const interval = setInterval(() => {
                if (typeof PortOne !== "undefined") {
                    clearInterval(interval);
                    callback();
                } else if (++attempts >= maxAttempts) {
                    clearInterval(interval);
                    alert("PortOne SDK 로드 실패. 새로고침 해주세요.");
                }
            }, 100);
        }

        waitForSDK(() => {
            console.log("PortOne SDK 로드 완료!");

            payButton.addEventListener("click", async () => {
                payButton.disabled = true;
                payButton.textContent = "결제 준비 중...";

                try {
                    // 서버 + 클라이언트 공통 결제 ID 생성
                    const paymentId = `PAY-${Date.now()}-${Math.random().toString(36).substring(2, 10)}`;

                    // ⭐ 1) 서버에 결제 준비 요청 → DB 저장
                    const prepareResponse = await fetch("/api/pay/prepare", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            paymentId: paymentId,
                            orderId: orderId,
                            orderName: orderName,
                            amount: amount
                        })
                    });

                    const prepareResult = await prepareResponse.json();

                    if (!prepareResult.success) {
                        alert("결제 생성 실패: " + prepareResult.message);
                        payButton.disabled = false;
                        payButton.textContent = "결제하기";
                        return;
                    }

                    // ⭐ 2) PortOne Checkout V2 결제 요청
                    await PortOne.requestPayment({
                        storeId: storeId,
                        paymentId: paymentId,
                        orderId: orderId,
                        orderName: orderName,
                        totalAmount: amount,
                        currency: "KRW",
                        successUrl: successUrl,
                        failUrl: failUrl
                    });

                    // PortOne이 자동으로 successUrl 또는 failUrl로 이동함

                } catch (err) {
                    console.error("결제 오류:", err);
                    alert("결제 처리 중 오류: " + err.message);
                    payButton.disabled = false;
                    payButton.textContent = "결제하기";
                }
            });
        });
    });
</script>

</body>
</html>
