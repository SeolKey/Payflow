<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock PG 결제 페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="bi bi-credit-card me-2"></i>Mock PG 결제 페이지
                        </h4>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle me-2"></i>
                            이것은 테스트용 Mock PG 페이지입니다.
                        </div>

                        <div class="mb-3">
                            <strong>주문번호:</strong> <span th:text="${orderId}"></span>
                        </div>
                        <div class="mb-3">
                            <strong>결제금액:</strong> <span th:text="${amount}"></span>원
                        </div>
                        <div class="mb-3">
                            <strong>결제수단:</strong> <span th:text="${method}"></span>
                        </div>

                        <hr>

                        <form th:action="@{/pg/mock/process}" method="post">
                            <input type="hidden" name="orderId" th:value="${orderId}">
                            <input type="hidden" name="amount" th:value="${amount}">
                            <input type="hidden" name="method" th:value="${method}">
                            <input type="hidden" name="returnUrl" th:value="${returnUrl}">
                            
                            <div class="d-grid gap-2">
                                <button type="submit" name="action" value="success" class="btn btn-success btn-lg">
                                    <i class="bi bi-check-circle me-2"></i>결제 성공 시뮬레이션
                                </button>
                                <button type="submit" name="action" value="fail" class="btn btn-danger btn-lg">
                                    <i class="bi bi-x-circle me-2"></i>결제 실패 시뮬레이션
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
