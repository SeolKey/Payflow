<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='회원가입')}"></head>

<body>
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-5">
            <div class="main-card">
                <div class="card-body-custom p-5">
                    <div class="text-center mb-4">
                        <a href="/" class="navbar-brand justify-content-center mb-3">
                            <i class="bi bi-wallet2"></i>PayFlow
                        </a>
                        <h2 class="mt-3 mb-2">회원가입</h2>
                        <p class="text-secondary">PayFlow에 오신 것을 환영합니다</p>
                    </div>

                    <!-- 에러 메시지 -->
                    <div th:if="${error}" class="alert alert-danger-custom alert-custom" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <!-- 성공 메시지 -->
                    <div th:if="${success}" class="alert alert-success-custom alert-custom" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}"></span>
                    </div>

                    <form id="signupForm" method="post" action="/signup">
                        <div class="mb-3">
                            <label for="name" class="form-label">이름</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="name" name="name" required 
                                       placeholder="이름을 입력하세요">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">이메일</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required 
                                       placeholder="example@email.com">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required 
                                       placeholder="비밀번호를 입력하세요" minlength="4">
                            </div>
                        </div>

                        <div class="d-grid gap-2 mb-3">
                            <button type="submit" class="btn btn-primary-custom">
                                <i class="bi bi-person-plus me-2"></i>회원가입
                            </button>
                        </div>
                    </form>

                    <div class="text-center">
                        <p class="mb-0 text-secondary">이미 계정이 있으신가요? <a href="/login" class="text-accent">로그인</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
