<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 생성 - PayFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-wallet2 me-2"></i>PayFlow
        </a>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">
                        <i class="bi bi-credit-card me-2"></i>결제 생성
                    </h3>
                </div>

                <div class="card-body p-4">
                    <!-- 기본 제출 막음 -->
                    <form id="paymentForm" onsubmit="return false;">

                        <div class="mb-3">
                            <label for="userId" class="form-label">유저 ID</label>
                            <input type="number" class="form-control" id="userId" name="userId" value="1" required>
                        </div>

                        <div class="mb-3">
                            <label for="amount" class="form-label">결제 금액</label>
                            <input type="number" class="form-control" id="amount" name="amount" required min="1">
                        </div>

                        <div class="mb-3">
                            <label for="method" class="form-label">결제 방식</label>
                            <select class="form-select" id="method" name="method" required>
                                <option value="card">카드</option>
                                <option value="vbank">가상계좌</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button id="submitBtn" class="btn btn-primary btn-lg">
                                결제 생성하기
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {

        const form = document.getElementById("paymentForm");
        const submitBtn = document.getElementById("submitBtn");

        submitBtn.addEventListener("click", async function (event) {
            event.preventDefault();
            console.log("⚡ 폼 제출 이벤트 실행됨");

            const formData = new FormData(form);

            const response = await fetch("/api/pay/create", {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            console.log("서버 응답:", data);

            if (data.success) {
                window.location.href = "/pay/request/" + data.orderId;
            } else {
                alert("결제 생성 실패: " + data.message);
            }
        });
    });
</script>

</body>
</html>
