<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 생성 - PayFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-wallet2 me-2"></i>PayFlow
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/pay/new">결제 생성</a>
                <a class="nav-link" href="/pay/list">결제 목록</a>
                <a class="nav-link" href="/users">사용자 목록</a>
                <a class="nav-link" th:if="${session.userId != null}" href="/logout">로그아웃</a>
                <a class="nav-link" th:unless="${session.userId != null}" href="/login">로그인</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">
                            <i class="bi bi-credit-card me-2"></i>결제 생성
                        </h3>
                    </div>
                    <div class="card-body p-4">
                        <form id="paymentForm">
                            <div class="mb-3">
                                <label for="userId" class="form-label">유저 ID</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="number" class="form-control" id="userId" name="userId" value="1" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="amount" class="form-label">결제 금액</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-currency-won"></i></span>
                                    <input type="number" class="form-control" id="amount" name="amount" required min="1">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="method" class="form-label">결제 방식</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-wallet"></i></span>
                                    <select class="form-select" id="method" name="method" required>
                                        <option value="card">카드</option>
                                        <option value="vbank">가상계좌</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="bi bi-check-circle me-2"></i>결제 생성하기
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById("paymentForm");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const formData = new FormData(form);

            const response = await fetch("/api/pay/create", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            console.log("응답 데이터:", data);

            if (data.success) {
                // PG사 리다이렉트 페이지로 이동
                window.location.href = data.redirectUrl;
            } else {
                alert("결제 생성 실패");
            }
        });
    </script>
</body>
</html>
