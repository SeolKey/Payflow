<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Detail</title>
</head>
<body>

<h1>결제 상세 정보</h1>

<p>ID: <span th:text="${payment.id}"></span></p>
<p>주문번호: <span th:text="${payment.orderId}"></span></p>
<p>유저 ID: <span th:text="${payment.user.id}"></span></p>
<p>금액: <span th:text="${payment.amount}"></span></p>
<p>결제수단: <span th:text="${payment.method}"></span></p>
<p>상태: <span th:text="${payment.status}"></span></p>
<p>생성일: <span th:text="${payment.createdAt}"></span></p>
<p>수정일: <span th:text="${payment.updatedAt}"></span></p>

<hr>

<a href="/pay/list">결제 목록으로 돌아가기</a>

</body>
</html>
