<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 상세 정보 - PayFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-wallet2 me-2"></i>PayFlow
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/pay/new">결제 생성</a>
                <a class="nav-link" href="/pay/list">결제 목록</a>
                <a class="nav-link" href="/users">사용자 목록</a>
                <a class="nav-link" th:if="${session.userId != null}" href="/logout">로그아웃</a>
                <a class="nav-link" th:unless="${session.userId != null}" href="/login">로그인</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">
                            <i class="bi bi-info-circle me-2"></i>결제 상세 정보
                        </h3>
                    </div>
                    <div class="card-body">
                        <table class="table table-bordered">
                            <tbody>
                                <tr>
                                    <th class="bg-light" style="width: 200px;">ID</th>
                                    <td th:text="${payment.id}"></td>
                                </tr>
                                <tr>
                                    <th class="bg-light">주문번호</th>
                                    <td th:text="${payment.orderId}"></td>
                                </tr>
                                <tr>
                                    <th class="bg-light">유저 ID</th>
                                    <td th:text="${payment.user.id}"></td>
                                </tr>
                                <tr>
                                    <th class="bg-light">금액</th>
                                    <td th:text="${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
                                </tr>
                                <tr>
                                    <th class="bg-light">결제수단</th>
                                    <td th:text="${payment.method}"></td>
                                </tr>
                                <tr>
                                    <th class="bg-light">상태</th>
                                    <td>
                                        <span class="badge bg-warning" th:if="${payment.status == 'ready'}">대기중</span>
                                        <span class="badge bg-success" th:if="${payment.status == 'completed'}">완료</span>
                                        <span class="badge bg-danger" th:if="${payment.status == 'failed'}">실패</span>
                                        <span th:if="${payment.status != 'ready' && payment.status != 'completed' && payment.status != 'failed'}" 
                                              th:text="${payment.status}"></span>
                                    </td>
                                </tr>
                                <tr>
                                    <th class="bg-light">생성일</th>
                                    <td th:text="${#temporals.format(payment.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                </tr>
                                <tr>
                                    <th class="bg-light">수정일</th>
                                    <td th:text="${#temporals.format(payment.updatedAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="mt-3">
                            <a href="/pay/list" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-2"></i>결제 목록으로 돌아가기
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
