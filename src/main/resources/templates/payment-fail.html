<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 실패 - PayFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-wallet2 me-2"></i>PayFlow
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/pay/new">결제 생성</a>
                <a class="nav-link" href="/pay/list">결제 목록</a>
                <a class="nav-link" href="/users">사용자 목록</a>
                <a class="nav-link" th:if="${session.userId != null}" href="/logout">로그아웃</a>
                <a class="nav-link" th:unless="${session.userId != null}" href="/login">로그인</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <i class="bi bi-x-circle-fill text-danger" style="font-size: 4rem;"></i>
                        <h2 class="card-title mt-4 mb-4">결제가 실패했습니다</h2>
                        
                        <div class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:if="${error}" th:text="${error}"></span>
                            <span th:unless="${error}">결제 처리 중 오류가 발생했습니다.</span>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                            <a href="/pay/new" class="btn btn-primary">
                                <i class="bi bi-arrow-clockwise me-2"></i>다시 결제하기
                            </a>
                            <a href="/pay/list" class="btn btn-outline-secondary">
                                <i class="bi bi-list-ul me-2"></i>결제 목록 보기
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
