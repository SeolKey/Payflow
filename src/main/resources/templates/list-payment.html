<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 목록 - PayFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-wallet2 me-2"></i>PayFlow
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/pay/new">결제 생성</a>
                <a class="nav-link active" href="/pay/list">결제 목록</a>
                <a class="nav-link" href="/users">사용자 목록</a>
                <a class="nav-link" th:if="${session.userId != null}" href="/logout">로그아웃</a>
                <a class="nav-link" th:unless="${session.userId != null}" href="/login">로그인</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h3 class="mb-0">
                    <i class="bi bi-list-ul me-2"></i>결제 목록
                </h3>
                <a href="/pay/new" class="btn btn-light btn-sm">
                    <i class="bi bi-plus-circle me-2"></i>새 결제 생성
                </a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>주문번호</th>
                                <th>금액</th>
                                <th>결제수단</th>
                                <th>상태</th>
                                <th>생성일</th>
                                <th>작업</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${payments}">
                                <td th:text="${p.id}"></td>
                                <td th:text="${p.orderId}"></td>
                                <td th:text="${#numbers.formatDecimal(p.amount, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
                                <td th:text="${p.method}"></td>
                                <td>
                                    <span class="badge bg-warning" th:if="${p.status == 'ready'}">대기중</span>
                                    <span class="badge bg-success" th:if="${p.status == 'completed'}">완료</span>
                                    <span class="badge bg-danger" th:if="${p.status == 'failed'}">실패</span>
                                    <span th:if="${p.status != 'ready' && p.status != 'completed' && p.status != 'failed'}" 
                                          th:text="${p.status}"></span>
                                </td>
                                <td th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                <td>
                                    <a th:href="@{|/pay/detail/${p.id}|}" class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-eye me-1"></i>보기
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
