<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Mock PG 결제')}"></head>

<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="main-card">
                <div class="card-header-custom">
                    <h3>
                        <i class="bi bi-credit-card"></i>Mock PG 결제 페이지
                    </h3>
                </div>
                <div class="card-body-custom">
                    <div class="alert alert-info-custom alert-custom">
                        <i class="bi bi-info-circle me-2"></i>
                        이것은 테스트용 Mock PG 페이지입니다.
                    </div>

                    <div class="table-wrapper mb-4">
                        <table class="detail-table">
                            <tbody>
                                <tr>
                                    <th>주문번호</th>
                                    <td><span class="order-id" th:text="${orderId}"></span></td>
                                </tr>
                                <tr>
                                    <th>결제금액</th>
                                    <td class="amount"><span th:text="${amount}"></span>원</td>
                                </tr>
                                <tr>
                                    <th>결제수단</th>
                                    <td th:text="${method}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <form th:action="@{/pg/mock/process}" method="post">
                        <input type="hidden" name="orderId" th:value="${orderId}">
                        <input type="hidden" name="amount" th:value="${amount}">
                        <input type="hidden" name="method" th:value="${method}">
                        <input type="hidden" name="returnUrl" th:value="${returnUrl}">
                        
                        <div class="d-grid gap-2">
                            <button type="submit" name="action" value="success" class="btn btn-primary-custom btn-lg" style="background: linear-gradient(135deg, #22c55e, #16a34a);">
                                <i class="bi bi-check-circle me-2"></i>결제 성공 시뮬레이션
                            </button>
                            <button type="submit" name="action" value="fail" class="btn btn-primary-custom btn-lg" style="background: linear-gradient(135deg, #ef4444, #dc2626);">
                                <i class="bi bi-x-circle me-2"></i>결제 실패 시뮬레이션
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
