<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='결제 실패')}"></head>

<body>
<nav th:replace="~{fragments/layout :: navbar(active='pay-list')}"></nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="main-card">
                <div class="card-body-custom text-center p-5">
                    <i class="bi bi-x-circle-fill result-icon fail"></i>
                    <h2 class="mt-4 mb-4">결제가 실패했습니다</h2>
                    
                    <div class="alert alert-danger-custom alert-custom" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:if="${error}" th:text="${error}"></span>
                        <span th:unless="${error}">결제 처리 중 오류가 발생했습니다.</span>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                        <a href="/pay/new" class="btn btn-primary-custom">
                            <i class="bi bi-arrow-clockwise me-2"></i>다시 결제하기
                        </a>
                        <a href="/pay/list" class="btn-secondary-custom">
                            <i class="bi bi-list-ul me-2"></i>결제 목록 보기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
