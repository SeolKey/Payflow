<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='결제 결과')}"></head>

<body>
<nav th:replace="~{fragments/layout :: navbar(active='pay-list')}"></nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="main-card">
                <div class="card-body-custom text-center p-5">
                    <i class="bi bi-check-circle-fill result-icon success"></i>
                    <h2 class="mt-4 mb-4">결제가 생성되었습니다</h2>
                    
                    <div class="table-wrapper mb-4">
                        <table class="detail-table text-start">
                            <tbody>
                                <tr>
                                    <th>주문번호</th>
                                    <td><span class="order-id" th:text="${payment.orderId}"></span></td>
                                </tr>
                                <tr>
                                    <th>유저 ID</th>
                                    <td th:text="${payment.user.id}"></td>
                                </tr>
                                <tr>
                                    <th>금액</th>
                                    <td class="amount" th:text="${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
                                </tr>
                                <tr>
                                    <th>결제수단</th>
                                    <td th:text="${payment.method}"></td>
                                </tr>
                                <tr>
                                    <th>상태</th>
                                    <td>
                                        <span class="badge-custom badge-ready" th:if="${payment.status == 'ready'}">대기중</span>
                                        <span class="badge-custom badge-completed" th:if="${payment.status == 'completed'}">완료</span>
                                        <span class="badge-custom badge-failed" th:if="${payment.status == 'failed'}">실패</span>
                                        <span th:if="${payment.status != 'ready' && payment.status != 'completed' && payment.status != 'failed'}" 
                                              th:text="${payment.status}"></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a th:href="@{|/pay/detail/${payment.orderId}|}" class="btn btn-primary-custom">
                            <i class="bi bi-eye me-2"></i>결제 상세 보기
                        </a>
                        <a href="/pay/list" class="btn-secondary-custom">
                            <i class="bi bi-list-ul me-2"></i>결제 목록 보기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
