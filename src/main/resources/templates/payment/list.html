<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='결제 목록')}"></head>

<body>
<nav th:replace="~{fragments/layout :: navbar(active='pay-list')}"></nav>

<div class="container mt-4">
    <div class="main-card">
        <div class="card-header-custom card-header-responsive">
            <div class="d-flex align-items-center gap-2">
                <h3 class="mb-0">
                    <i class="bi bi-list-ul"></i>결제 목록
                </h3>
                <!-- 정렬 드롭다운 -->
                <div class="dropdown">
                    <button class="btn-sort-dropdown dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-filter"></i>
                        <span class="sort-label" th:text="${currentSort == 'latest'} ? '최신순' : 
                            (${currentSort == 'oldest'} ? '오래된순' : 
                            (${currentSort == 'orderId'} ? '주문번호순' : 
                            (${currentSort == 'highAmount'} ? '고액순' : 
                            (${currentSort == 'lowAmount'} ? '저액순' : '최신순'))))">최신순</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-custom">
                        <li><a class="dropdown-item" th:classappend="${currentSort == 'latest'} ? 'active'" href="/pay/list?sort=latest"><i class="bi bi-arrow-down me-2"></i>최신순</a></li>
                        <li><a class="dropdown-item" th:classappend="${currentSort == 'oldest'} ? 'active'" href="/pay/list?sort=oldest"><i class="bi bi-arrow-up me-2"></i>오래된순</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:classappend="${currentSort == 'orderId'} ? 'active'" href="/pay/list?sort=orderId"><i class="bi bi-hash me-2"></i>주문번호순</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:classappend="${currentSort == 'highAmount'} ? 'active'" href="/pay/list?sort=highAmount"><i class="bi bi-graph-up-arrow me-2"></i>고액순</a></li>
                        <li><a class="dropdown-item" th:classappend="${currentSort == 'lowAmount'} ? 'active'" href="/pay/list?sort=lowAmount"><i class="bi bi-graph-down-arrow me-2"></i>저액순</a></li>
                    </ul>
                </div>
            </div>
            <a href="/pay/new" class="btn-header">
                <i class="bi bi-plus-circle me-2"></i><span class="btn-header-text">새 결제 생성</span>
            </a>
        </div>
        <div class="card-body-custom p-0">
            <div class="table-responsive">
                <table class="table table-custom" th:if="${payments != null and !payments.empty}">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>주문번호</th>
                            <th class="d-none d-sm-table-cell">주문자</th>
                            <th class="d-none d-md-table-cell">금액</th>
                            <th class="d-none d-md-table-cell">결제수단</th>
                            <th class="d-none d-sm-table-cell">상태</th>
                            <th class="d-none d-lg-table-cell">생성일</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${payments}">
                            <td th:text="${p.id}"></td>
                            <td><span class="order-id" th:text="${#strings.substring(p.orderId, p.orderId.length() - 4)}"></span></td>
                            <td class="d-none d-sm-table-cell" th:text="${p.user.name}"></td>
                            <td class="d-none d-md-table-cell amount" th:text="${#numbers.formatDecimal(p.amount, 0, 'COMMA', 0, 'POINT')} + '원'"></td>
                            <td class="d-none d-md-table-cell" th:text="${p.method}"></td>
                            <td class="d-none d-sm-table-cell">
                                <span class="badge-custom badge-ready" th:if="${p.status == 'ready'}">대기중</span>
                                <span class="badge-custom badge-completed" th:if="${p.status == 'completed'}">완료</span>
                                <span class="badge-custom badge-failed" th:if="${p.status == 'failed'}">실패</span>
                                <span th:if="${p.status != 'ready' && p.status != 'completed' && p.status != 'failed'}" 
                                      th:text="${p.status}"></span>
                            </td>
                            <td class="d-none d-lg-table-cell" th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd')}"></td>
                            <td>
                                <a th:href="@{|/pay/detail/${p.orderId}|}" class="btn-view-detail">
                                    <i class="bi bi-eye"></i><span class="btn-view-text">보기</span>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="empty-state" th:if="${payments == null or payments.empty}">
                    <i class="bi bi-inbox"></i>
                    <h5>결제 내역이 없습니다</h5>
                    <p>새 결제를 생성해보세요.</p>
                    <a href="/pay/new" class="btn btn-primary-custom mt-3">
                        <i class="bi bi-plus-circle me-2"></i>결제 생성하기
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
