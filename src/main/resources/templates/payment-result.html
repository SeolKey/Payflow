<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제 결과 - PayFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-wallet2 me-2"></i>PayFlow
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/pay/new">결제 생성</a>
                <a class="nav-link" href="/pay/list">결제 목록</a>
                <a class="nav-link" href="/users">사용자 목록</a>
                <a class="nav-link" th:if="${session.userId != null}" href="/logout">로그아웃</a>
                <a class="nav-link" th:unless="${session.userId != null}" href="/login">로그인</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                        <h2 class="card-title mt-4 mb-4">결제가 생성되었습니다</h2>
                        
                        <div class="card bg-light mb-4">
                            <div class="card-body text-start">
                                <div class="row mb-3">
                                    <div class="col-sm-4 fw-bold">주문번호:</div>
                                    <div class="col-sm-8" th:text="${payment.orderId}"></div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-sm-4 fw-bold">유저 ID:</div>
                                    <div class="col-sm-8" th:text="${payment.user.id}"></div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-sm-4 fw-bold">금액:</div>
                                    <div class="col-sm-8" th:text="${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 0, 'POINT')} + '원'"></div>
                                </div>
                                <div class="row mb-3">
                                    <div class="col-sm-4 fw-bold">결제수단:</div>
                                    <div class="col-sm-8" th:text="${payment.method}"></div>
                                </div>
                                <div class="row">
                                    <div class="col-sm-4 fw-bold">상태:</div>
                                    <div class="col-sm-8">
                                        <span class="badge bg-success" th:if="${payment.status == 'ready'}">대기중</span>
                                        <span class="badge bg-primary" th:if="${payment.status == 'completed'}">완료</span>
                                        <span class="badge bg-danger" th:if="${payment.status == 'failed'}">실패</span>
                                        <span th:if="${payment.status != 'ready' && payment.status != 'completed' && payment.status != 'failed'}" 
                                              th:text="${payment.status}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <a th:href="@{|/pay/detail/${payment.id}|}" class="btn btn-primary">
                                <i class="bi bi-eye me-2"></i>결제 상세 보기
                            </a>
                            <a href="/pay/list" class="btn btn-outline-primary">
                                <i class="bi bi-list-ul me-2"></i>결제 목록 보기
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
